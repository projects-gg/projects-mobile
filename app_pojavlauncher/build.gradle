plugins {
    id 'com.android.application' version '9.3.1'
}

static def getDate() { return new Date().format('yyyyMMdd') }

def getVersionName = {
    // Get the last version tag, as well as the short head of the last commit
    String TAG = ""
    String semVer = "1.1.7"
    // Used by the fallback for github actions
    String TAG_PART_COMMIT = ""
    String TAG_STRING

    try {
        TAG = providers.exec {
            commandLine 'git', 'describe', '--tags'
            ignoreExitValue = true
        }.getStandardOutput().asText.get()
    } catch (Exception e) {
        e.printStackTrace()
    }

    // Fallback for action builds
    if (TAG.toString().trim().isEmpty()) {
        try {
            TAG_PART_COMMIT = providers.exec {
                commandLine 'git', 'describe', '--always', '--tags'
                ignoreExitValue = true
            }.getStandardOutput().asText.get()
        } catch (Exception ignored) {
        }
    }


    if(!TAG.isBlank()){
        TAG_STRING = TAG
    }else {
        if(TAG_PART_COMMIT.isBlank()){
             //Fallback no repo
            return ("LOCAL-" + "${getDate()}")
        }else {
            // Used by github actions
            TAG_STRING =  'amethyst-legacy-' + "${getDate()}" + "-" + TAG_PART_COMMIT.toString().trim()
        }

    }

    def isRelease = project.gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
    if(!isRelease){
        return TAG_STRING.trim().replace("-g", "-") + "-" + "debug-" + semVer
    }else {
        return TAG_STRING.trim().replace("-g", "-") + "-" + "release-" + semVer
    }
}

// Projects fork: own version line. versionCode must grow with every published build.
def projectsVersionCode = 24
def projectsVersionName = "0.4.8"
def getProjectsVersionName = {
    String commit = ""
    try {
        commit = providers.exec {
            commandLine 'git', 'rev-parse', '--short', 'HEAD'
            ignoreExitValue = true
        }.getStandardOutput().asText.get().trim()
    } catch (Exception ignored) {
    }
    def isRelease = project.gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') || it.toLowerCase().contains('gplay') }
    if (isRelease) return projectsVersionName
    return projectsVersionName + "-debug" + (commit.isEmpty() ? "" : "+" + commit)
}

// Projects fork: release signing comes from the environment, never from the repository.
// PROJECTS_KEYSTORE_FILE, PROJECTS_KEYSTORE_PASSWORD, PROJECTS_KEY_ALIAS, PROJECTS_KEY_PASSWORD
def projectsKeystore = System.getenv("PROJECTS_KEYSTORE_FILE")

// Projects fork (M19): Firebase Cloud Messaging for the friends feature, without the google-services
// plugin. The Firebase config file (app_pojavlauncher/google-services.json) is git-ignored and never in
// the public repository: the release script copies it in for the build. When it is there, the client of
// the build's application id becomes the resources Firebase starts from; without it the app builds the
// same and phone notifications are simply off (BuildConfig.PROJECTS_FIREBASE false).
def projectsFirebase = { String packageName ->
    def file = project.file('google-services.json')
    if (!file.isFile()) return null
    def json = new groovy.json.JsonSlurper().parse(file)
    def client = json.client?.find { it?.client_info?.android_client_info?.package_name == packageName }
    if (client == null) return null
    def apiKey = client.api_key?.find { it?.current_key }?.current_key
    def appId = client.client_info?.mobilesdk_app_id
    def projectId = json.project_info?.project_id
    def senderId = json.project_info?.project_number
    if (!apiKey || !appId || !projectId || !senderId) return null
    return [apiKey: apiKey.toString(), appId: appId.toString(), projectId: projectId.toString(), senderId: senderId.toString()]
}
def projectsFirebaseRelease = projectsFirebase('gg.projects.mobile')
def projectsFirebaseDebug = projectsFirebase('gg.projects.mobile.debug')

def getCFApiKey = {
    String key = System.getenv("CURSEFORGE_API_KEY");
    if(key != null) return key;
    File curseforgeKeyFile = new File("$projectDir/curseforge_key.txt");
    if(curseforgeKeyFile.canRead() && curseforgeKeyFile.isFile()) {
        return curseforgeKeyFile.text;
    }
    logger.warn('BUILD: You have no CurseForge key, the curseforge api will get disabled !');
    return "DUMMY";
}

configurations {
    instrumentedClasspath {
        canBeConsumed = false
        canBeResolved = true
    }
}

android {
    namespace 'net.kdt.pojavlaunch'

    compileSdk = 37


    signingConfigs {
        customDebug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        if (projectsKeystore != null) {
            projectsRelease {
                storeFile file(projectsKeystore)
                storePassword System.getenv("PROJECTS_KEYSTORE_PASSWORD")
                keyAlias System.getenv("PROJECTS_KEY_ALIAS")
                keyPassword System.getenv("PROJECTS_KEY_PASSWORD")
            }
        }
    }

    defaultConfig {
        applicationId "gg.projects.mobile"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode projectsVersionCode
        versionName getProjectsVersionName()
        // APK-UPD: the app's own updater (gg.projects.mobile.update); off in the Play build.
        buildConfigField 'boolean', 'PROJECTS_UPDATER', 'true'
        multiDexEnabled true //important
        resValue 'string', 'curseforge_api_key', getCFApiKey()
        externalNativeBuild {
            ndkBuild {
                // Fix for Windows command line length limit
                arguments "APP_SHORT_COMMANDS=true"
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.customDebug
            resValue "string", "app_name", "Projects Launcher (Debug)"
            resValue "string", "app_short_name", "Projects (Debug)"
            resValue 'string', 'application_package', 'gg.projects.mobile.debug'
            resValue 'string', 'storageProviderAuthorities', 'gg.projects.mobile.scoped.gamefolder.debug'
            resValue 'string', 'shareProviderAuthority', 'gg.projects.mobile.scoped.controlfolder.debug'
            // M19: the debug app's own Firebase client (when the config file is there).
            buildConfigField 'boolean', 'PROJECTS_FIREBASE', projectsFirebaseDebug != null ? 'true' : 'false'
            if (projectsFirebaseDebug != null) {
                resValue 'string', 'google_app_id', projectsFirebaseDebug.appId
                resValue 'string', 'google_api_key', projectsFirebaseDebug.apiKey
                resValue 'string', 'gcm_defaultSenderId', projectsFirebaseDebug.senderId
                resValue 'string', 'project_id', projectsFirebaseDebug.projectId
            }
        }
        proguard {
            initWith debug
            minifyEnabled true
            shrinkResources true
        }
        proguardNoDebug {
            initWith proguard
            debuggable false
        }

        release {
            // Don't set to true or java.awt will be a.a or something similar.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Unsigned unless PROJECTS_KEYSTORE_FILE is set (see docs/mobile.md in ProLauncher2).
            signingConfig projectsKeystore != null ? signingConfigs.projectsRelease : null
            // defaultConfig already set
            // multiDexEnabled = true
            // debuggable = true
            resValue "string", "app_name", "Projects Launcher"
            resValue "string", "app_short_name", "Projects"
            resValue 'string', 'storageProviderAuthorities', 'gg.projects.mobile.scoped.gamefolder'
            resValue 'string', 'application_package', 'gg.projects.mobile'
            // M19: the app's Firebase client (when the config file is there).
            buildConfigField 'boolean', 'PROJECTS_FIREBASE', projectsFirebaseRelease != null ? 'true' : 'false'
            if (projectsFirebaseRelease != null) {
                resValue 'string', 'google_app_id', projectsFirebaseRelease.appId
                resValue 'string', 'google_api_key', projectsFirebaseRelease.apiKey
                resValue 'string', 'gcm_defaultSenderId', projectsFirebaseRelease.senderId
                resValue 'string', 'project_id', projectsFirebaseRelease.projectId
            }
        }
        gplay {
            // Google Play: sign the bundle with the upload key (same PROJECTS_* variables).
            initWith release
            matchingFallbacks = [ 'release' ]
            // APK-UPD: Play forbids an app updating itself any other way: no updater, no install permissions
            // (src/gplay/AndroidManifest.xml removes them).
            buildConfigField 'boolean', 'PROJECTS_UPDATER', 'false'
        }
    }

    ndkVersion = rootProject.ext.projectsNdkVersion

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    // Projects fork: the app speaks Turkish and English only (gg.projects.mobile.language). Upstream's
    // partial translations into other languages would mix with the English Projects screens, so a
    // phone in another language gets the whole app in English.
    androidResources {
        localeFilters += ['en', 'tr']
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            // If you're debugging mesa libs, put them here, android will strip them
            // and not properly link to source files, very smart android studio.
            keepDebugSymbols += ['**/libcutils.so']
            pickFirsts += ['**/libbytehook.so']
        }
    }

    buildFeatures {
        prefab true
        buildConfig true
    }

    lint {
        abortOnError false
    }
}

// APK-UPD: a debug build may carry another version (-PprojectsDebugVersionCode=23 -PprojectsDebugVersionName=0.4.7)
// so the in-app updater can be tried end to end with a second APK on an emulator. Release and Play builds always
// take projectsVersionCode and projectsVersionName.
androidComponents {
    onVariants(selector().withBuildType('debug')) { variant ->
        def code = project.findProperty('projectsDebugVersionCode')
        def name = project.findProperty('projectsDebugVersionName')
        variant.outputs.each { output ->
            if (code != null) output.versionCode.set((code as String).toInteger())
            if (name != null) output.versionName.set(name as String)
        }
    }
}

afterEvaluate {
    def componentJars = [
            ":forge_installer:jar",
            ":arc_dns_injector:jar",
            ":MioLibPatcher:jar",
            ":jre_lwjgl3glfw:jar"
    ]

    tasks.withType(com.android.build.gradle.tasks.MergeSourceSetFolders).configureEach { t ->
        t.dependsOn(componentJars)
    }

    // Needed or else the release builds complain about undeclared dependencies
    tasks.matching { it.name.toLowerCase().contains("lint") }.configureEach { t ->
        t.dependsOn(componentJars)
    }
}

