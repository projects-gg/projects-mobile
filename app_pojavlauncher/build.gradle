    // https://github.com/PojavLauncherTeam/exp4j
    implementation 'net.sourceforge.htmlcleaner:htmlcleaner:2.6.1'
    // Projects fork (M8): 1.0.10 rebuilt for 16 KB pages, from libs/maven (scripts/projects/build_bytehook_16kb.py)
    implementation 'com.bytedance:bytehook:1.0.10-16kb'

    // implementation 'net.sourceforge.streamsupport:streamsupport-cfuture:1.7.0'

    implementation 'top.fifthlight.touchcontroller:proxy-client-android:0.0.4'

    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])

    // 5.17.0+ natives load on 16 KB page devices (same JNI interface 7.0.x as 5.14.0)
    implementation "net.java.dev.jna:jna:5.18.1@aar"

    implementation project(":androidnsbypass")

    // Projects fork: Ed25519 verification of the signed content index
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.86'
    // Projects fork (M19): Friends and crews. OkHttp talks to the friends service (HTTPS and the presence
    // WebSocket with protocol pings); Firebase Cloud Messaging brings phone notifications (messaging only,
    // no Analytics; the 33.x BoM is the last whose messaging keeps minSdk 21); ZXing's core draws the
    // friend code's QR (3.3.3: the last core for Android below 7 without Java 8 library calls).
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation platform('com.google.firebase:firebase-bom:33.16.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.zxing:core:3.3.3'
    testImplementation 'junit:junit:4.13.2'
}
apply from: rootProject.file('gradle/prefab_bypass.gradle')
