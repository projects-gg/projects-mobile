import java.security.MessageDigest

plugins{
    id 'com.android.application' version '9.3.1' apply false
    id 'com.android.library' version '9.3.1' apply false
}

static void hashFileWithDigest(File fileToHash, MessageDigest digest){
    fileToHash.withInputStream { is ->
        byte[] buffer = new byte[8192]
        int read
        while ((read = is.read(buffer)) != -1) {
            digest.update(buffer, 0, read)
        }
    }
}

static void writeVersionFile(File jarFile, File versionFile){
    def sha1 = MessageDigest.getInstance("SHA-1")
    hashFileWithDigest(jarFile, sha1)
    versionFile.write(sha1.digest().collect { String.format("%02x", it) }.join())
}

static void writeVersionFile(File[] jarFileArray, File versionFile){
    def sha1 = MessageDigest.getInstance("SHA-1")
    jarFileArray.each {jarFile ->
        hashFileWithDigest(jarFile, sha1)
    }
    versionFile.write(sha1.digest().collect { String.format("%02x", it) }.join())
}

// One NDK for every Android module. A module without its own ndkVersion (the androidnsbypass submodule) builds with
// the newest NDK installed (28.2 on the build machine since October 2026); the app's NDK 27 then refuses the prefab
// library it publishes and libpojavexec fails to link the namespace functions.
ext.projectsNdkVersion = "27.3.13750724"
subprojects {subproject ->
    subproject.plugins.withId("com.android.library") {
        subproject.android.ndkVersion = rootProject.ext.projectsNdkVersion
        // AGP 9.3's prefab<Variant>ConfigurePackage writes the library's full prefab publication
        // (intermediates/prefab_package_configuration/prefab_publication.json/<variant>) outside its declared output
        // file, which therefore never exists. Gradle's history records that missing file, so once build/ is deleted
        // the task stays UP-TO-DATE, the publication is not written again, the app imports the header-only one and
        // libpojavexec fails to link the namespace functions. The task only rewrites a small JSON file when it
        // differs: run it every time.
        subproject.tasks.matching { it.name ==~ /prefab\w*ConfigurePackage/ }.configureEach {
            it.outputs.upToDateWhen { false }
        }
    }
    subproject.plugins.withId("com.android.application") {
        subproject.android.ndkVersion = rootProject.ext.projectsNdkVersion
    }
}

subprojects {subproject ->
    if (subproject.name.contains("lwjgl")) return
    tasks.withType(Jar).configureEach {jar ->
        System.out.println("Subproject $subproject configuring jar task destination to app_pojavlauncher/src/main/assets/components/$subproject.name/")
        destinationDirectory.set(
                file("../app_pojavlauncher/src/main/assets/components/$subproject.name")
        )
        doLast {
            def versionFile  = new File(project(":app_pojavlauncher").projectDir, "src/main/assets/components/$subproject.name/version")
            def jarFile = archiveFile.get().asFile
            writeVersionFile(jarFile, versionFile)
        }
    }
}